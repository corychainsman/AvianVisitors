# Share the single-subdevice USB lavalier between BirdNET's segment recorder
# and the Icecast livestream encoder. Both processes run as the same uid in
# the container, so one dsnoop ring buffer can safely fan out the capture.
pcm.avian_capture_raw {
    type dsnoop
    ipc_key 24681357
    ipc_perm 0666
    slave {
        pcm "hw:CARD=Microphone,DEV=0"
        channels 1
        rate 48000
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}

pcm.avian_capture {
    type plug
    slave.pcm "avian_capture_raw"
}

ctl.avian_capture {
    type hw
    card Microphone
}
