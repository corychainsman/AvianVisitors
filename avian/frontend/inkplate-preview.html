<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkplate frame preview</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 64px);
      background: #e7e4dc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #2b2925;
    }
    main { width: min(88vw, 720px); }
    .device {
      padding: 3.9%;
      border-radius: 2.1%;
      background: #171717;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.12),
        inset 0 0 22px rgba(255,255,255,.05),
        0 22px 55px rgba(40,34,25,.24);
    }
    .screen {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #fcfcfa;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
    }
    .status {
      margin: 14px 2px 0;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #6f695f;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="device" aria-label="Inkplate 13 Spectra preview">
      <img class="screen" id="frame" src="/frame.jpg" alt="Current Avian Visitors Inkplate frame">
    </div>
    <p class="status" id="status">Current published 1200 × 1600 frame</p>
  </main>
  <script>
    (async function refresh() {
      try {
        const response = await fetch('/frame.sha256', { cache: 'no-store' });
        if (!response.ok) throw new Error('frame hash unavailable');
        const hash = (await response.text()).trim();
        if (hash) document.getElementById('frame').src = '/frame.jpg?v=' + encodeURIComponent(hash);
      } catch (error) {
        document.getElementById('status').textContent = 'Current frame · preview refresh unavailable';
      }
    }());
  </script>
</body>
</html>
